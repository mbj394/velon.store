<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VELON</title>
<style>
:root{--g:#c9a24b;--g2:#f1d98b;--g3:#8a6a1f;--bg:#faf7f0;--card:#fff;--tx:#241d0e;--mu:#7a6f58;--bd:#eadfc3;--sh:0 8px 28px rgba(138,106,31,.15)}
:root[data-theme=dark]{--bg:#0f0d08;--card:#1a160c;--tx:#f5ead0;--mu:#a89a78;--bd:#3a2f15;--sh:0 8px 28px rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",system-ui,sans-serif;min-height:100vh;padding-bottom:80px}
button,input,select,textarea{font:inherit;color:inherit}
.gold{background:linear-gradient(110deg,var(--g3),var(--g),var(--g2),var(--g),var(--g3));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}
@keyframes sh{to{background-position:-250% 0}}@keyframes up{from{opacity:0;transform:translateY(20px)}}
#splash{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at 50% 40%,#2a210c,#0a0804);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s,visibility .8s}
#splash.out{opacity:0;visibility:hidden}
#splash .lg{font-size:clamp(48px,16vw,96px);font-weight:800;letter-spacing:.25em;padding-inline-start:.25em;animation:zm 1.6s both}
#splash .ln{height:2px;width:0;background:linear-gradient(90deg,transparent,var(--g2),transparent);animation:ln 1.6s .4s forwards;margin:14px 0}
#splash p{color:var(--g);letter-spacing:.2em;font-size:12px;opacity:0;animation:fi 1s 1s forwards}
@keyframes zm{from{opacity:0;transform:scale(.6);filter:blur(12px)}}@keyframes ln{to{width:min(260px,60vw)}}@keyframes fi{to{opacity:1}}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
header .lg{font-weight:800;letter-spacing:.2em;font-size:20px;margin-inline-end:auto}
.ib{background:var(--card);border:1px solid var(--bd);border-radius:12px;min-width:40px;height:40px;cursor:pointer;position:relative;transition:.2s}.ib:hover{border-color:var(--g);transform:translateY(-2px)}
.bd{position:absolute;top:-6px;inset-inline-end:-6px;background:var(--g);color:#000;border-radius:99px;font-size:11px;padding:1px 6px;font-weight:700}
.btn{background:linear-gradient(135deg,var(--g3),var(--g),var(--g2));color:#1a1305;border:0;border-radius:12px;padding:11px 20px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(201,162,75,.35);transition:.2s}.btn:hover{transform:translateY(-2px)}
.btn.o{background:transparent;color:var(--g);border:1.5px solid var(--g);box-shadow:none}.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}.btn.rd{background:#b3382c;color:#fff;box-shadow:none}.btn[disabled]{opacity:.4;cursor:not-allowed}
main{max-width:1100px;margin:auto;padding:14px 14px 20px}
.car{position:relative;overflow:hidden;border-radius:20px;box-shadow:var(--sh);aspect-ratio:16/7;min-height:150px;touch-action:pan-y}
.tr{display:flex;height:100%;transition:transform .6s cubic-bezier(.7,0,.2,1)}.sl{flex:0 0 100%;height:100%}.sl img{width:100%;height:100%;object-fit:cover;display:block}
.sl.def{display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 30% 30%,#3a2d0e,#0a0804);color:#f5ead0;padding:20px}.sl.def h2{font-size:clamp(30px,9vw,64px);letter-spacing:.2em}
.ar2{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;cursor:pointer;font-size:18px}
.dots{position:absolute;bottom:8px;width:100%;display:flex;justify-content:center;gap:6px}.dots i{width:8px;height:8px;border-radius:9px;background:#fff8;transition:.3s}.dots i.on{width:22px;background:var(--g2)}
.prs{display:flex;gap:10px;overflow-x:auto;padding:12px 2px;scroll-snap-type:x mandatory}
.pr1{flex:0 0 min(280px,78%);scroll-snap-align:start;border-radius:16px;padding:14px;background:linear-gradient(135deg,var(--g3),var(--g),var(--g2));color:#1a1305;position:relative;overflow:hidden}
.pr1:after{content:"%";position:absolute;inset-inline-end:-6px;bottom:-26px;font-size:90px;font-weight:900;opacity:.15}
.pr1 b{font-size:17px;display:block}.pr1 span{font-size:13px}.cd{display:inline-flex;gap:6px;align-items:center;margin-top:8px;background:#1a1305;color:var(--g2);border:0;border-radius:9px;padding:5px 11px;cursor:pointer;font-weight:700;letter-spacing:.1em}
.hero{text-align:center;padding:30px 10px}.hero h1{font-size:clamp(26px,6vw,44px);margin-bottom:8px}.hero p{color:var(--mu);margin-bottom:16px}
h2.t{font-size:22px;margin:30px 0 12px;display:flex;align-items:center;gap:10px}h2.t:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--g),transparent)}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.why div{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;text-align:center;transition:.3s}.why div:hover{transform:translateY(-5px);border-color:var(--g)}.why b{display:block;font-size:28px}.why span{color:var(--mu);font-size:14px}
.search,.in{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);outline:0;margin-bottom:8px}.search:focus,.in:focus{border-color:var(--g)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.chip{white-space:nowrap;border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:7px 16px;cursor:pointer}.chip.on{background:var(--g);color:#1a1305;border-color:var(--g);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:.3s;animation:up .5s both;position:relative;cursor:pointer}.card:hover{transform:translateY(-5px);box-shadow:var(--sh);border-color:var(--g)}
.im{aspect-ratio:1;background:linear-gradient(135deg,color-mix(in srgb,var(--g) 18%,var(--card)),var(--card));display:flex;align-items:center;justify-content:center;font-size:60px}.im img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:8px;inset-inline-start:8px;background:#b3382c;color:#fff;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700;z-index:1}
.cb{padding:10px;display:flex;flex-direction:column;gap:5px;flex:1}.cb h3{font-size:15px}.cb small{color:var(--mu)}
.pr{font-weight:800;color:var(--g);font-size:17px}.pr s{color:var(--mu);font-size:13px;font-weight:400;margin-inline-start:6px}
.av{font-size:12px}.av.y{color:#2e9e5b}.av.n{color:#c0392b}.nt{font-size:12px;color:var(--mu);border-inline-start:3px solid var(--g);padding-inline-start:8px}.card .btn{margin-top:auto}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;justify-content:flex-end}.ov.on{display:flex}.ov.c{align-items:center;justify-content:center;z-index:60}
.pn{background:var(--bg);width:min(440px,100%);height:100%;overflow-y:auto;padding:16px;animation:sl .3s}[dir=rtl] .pn{--sx:-100%}[dir=ltr] .pn{--sx:100%}@keyframes sl{from{transform:translateX(var(--sx))}}
.md{border-radius:20px;height:auto;max-height:92vh;width:min(520px,94%);animation:up .3s}
.row{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px;flex-wrap:wrap}.row .n{flex:1;min-width:120px}
.q{display:flex;align-items:center;gap:8px}.q button{width:32px;height:32px;border-radius:9px;border:1px solid var(--g);background:0;cursor:pointer;font-size:16px}
.sm2{display:flex;justify-content:space-between;padding:4px 0}.tot{font-size:20px;font-weight:800;color:var(--g)}
.fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));inset-inline-start:14px;display:flex;flex-direction:column;gap:8px;z-index:15}
.fab button,.fab a{width:46px;height:46px;border-radius:50%;border:0;background:var(--g);color:#1a1305;font-size:20px;cursor:pointer;box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;text-decoration:none}
#top{opacity:0;pointer-events:none;transition:.3s}#top.on{opacity:1;pointer-events:auto}
#bar{position:fixed;bottom:0;inset-inline:0;z-index:16;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:none}#bar.on{display:block;animation:up .3s}
#bar button{width:100%;max-width:700px;margin:auto;display:flex;justify-content:space-between;font-size:16px;padding:14px 20px}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1a1305;color:var(--g2);border:1px solid var(--g);padding:10px 18px;border-radius:12px;z-index:100;display:none;max-width:90%}
.tabs{display:flex;gap:4px;margin-bottom:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;position:sticky;top:0;z-index:2}
.tabs button{flex:1 1 0;min-width:0;border:0;background:0;border-radius:10px;padding:9px 1px;font-size:11px;cursor:pointer;line-height:1.2}.tabs button.on{background:var(--g);color:#1a1305;font-weight:700}
.opt{display:flex;gap:8px;margin-bottom:10px}.opt label{flex:1;border:1.5px solid var(--bd);border-radius:12px;padding:11px;text-align:center;cursor:pointer;background:var(--card)}.opt label:has(input:checked){border-color:var(--g);background:color-mix(in srgb,var(--g) 18%,var(--card));font-weight:700}.opt input{display:none}
.g1{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:90px}.g1 img{width:100%;height:100%;object-fit:contain}
.th{display:flex;gap:6px;margin:8px 0;overflow-x:auto}.th img{width:56px;height:56px;object-fit:cover;border-radius:10px;border:2px solid transparent;cursor:pointer}.th img.on{border-color:var(--g)}
.empty{text-align:center;color:var(--mu);padding:26px}label.l{font-size:13px;color:var(--mu);display:block;margin:4px 0}
.timg{position:relative;display:inline-block}.timg button{position:absolute;top:-4px;inset-inline-end:-4px;border:0;background:#b3382c;color:#fff;border-radius:50%;width:20px;height:20px;cursor:pointer}.timg img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.stp{display:flex;justify-content:space-between;margin:14px 0}.stp div{flex:1;text-align:center;font-size:12px;color:var(--mu)}.stp b{display:flex;width:38px;height:38px;border-radius:50%;margin:0 auto 4px;align-items:center;justify-content:center;background:var(--card);border:2px solid var(--bd);font-size:18px}.stp .on{color:var(--tx)}.stp .on b{background:var(--g);border-color:var(--g)}.stp .cur b{animation:pl 1.5s infinite}@keyframes pl{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--g) 28%,transparent)}}
#nv{display:flex;gap:8px;margin:0 0 12px}#nv .chip{flex:1;text-align:center;padding:10px;font-weight:700}.hint{font-size:12px;color:var(--mu);margin:6px 0}
.trc{text-align:center;background:linear-gradient(135deg,color-mix(in srgb,var(--g) 22%,var(--card)),var(--card));border:1px solid var(--bd);border-radius:20px;padding:20px;margin-bottom:14px}.trc h2{margin:4px 0}.trc p{color:var(--mu);font-size:14px;margin:6px 0 14px}.oc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;animation:up .4s both}
.pbx{padding:10px;border-radius:12px;margin:8px 0;font-size:14px;border:1px solid var(--bd);text-align:start}.pbx small{display:block;color:var(--mu)}.pbx.verified,.pbx.confirmed{border-color:#2e9e5b;color:#2e9e5b}.pbx.review,.pbx.checking{border-color:var(--g)}.pbx.rejected{border-color:#c0392b;color:#c0392b}
.hlp{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}.hlp .btn{padding:10px 4px;font-size:12px;line-height:1.35;min-height:58px;white-space:normal;display:flex;align-items:center;justify-content:center;text-align:center}
.tabs{overflow-x:auto}.tabs button{flex:1 0 auto;padding:9px 11px;font-size:12px;white-space:nowrap}.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.kp div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}.kp b{display:block;font-size:17px;color:var(--g)}.kp small{color:var(--mu)}.bars{display:flex;align-items:flex-end;gap:4px;height:120px;margin:8px 0}.bars>div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer}.bars i{width:100%;background:linear-gradient(var(--g2),var(--g3));border-radius:4px 4px 0 0;min-height:2px}.bars small{font-size:9px;color:var(--mu)}.bars .on small{color:var(--g);font-weight:700}.bars .on i{outline:2px solid var(--tx)}
#pinB{display:flex;gap:8px;justify-content:center}.pb{width:44px;height:56px;text-align:center;font-size:24px;font-weight:700;border-radius:12px;border:2px solid var(--bd);background:var(--card);outline:0;padding:0}.pb:focus,.pb.f{border-color:var(--g)}.pb:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--g) 25%,transparent)}.shake{animation:shk .4s}@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#offl{display:none;position:fixed;top:0;inset-inline:0;z-index:120;background:#b3382c;color:#fff;padding:10px 14px;align-items:center;justify-content:center;gap:10px;font-size:14px}#offl button{border:0;border-radius:8px;padding:5px 12px;cursor:pointer}
.inv{background:#fff;color:#111;border-radius:14px;padding:28px;font-size:14px;line-height:1.6}.inv table{width:100%;border-collapse:collapse;margin:14px 0}.inv th{background:#f5efe0;text-align:start;padding:8px;border-bottom:2px solid #c9a24b}.inv td{padding:8px;border-bottom:1px solid #e8dfc6;white-space:nowrap}.inv td:first-child{white-space:normal}.inv .r{display:flex;justify-content:space-between;padding:3px 0}.inv .tt{font-size:18px;font-weight:800;border-top:2px solid #c9a24b;margin-top:6px;padding-top:8px}
@media(max-width:480px){.inv{padding:16px;font-size:13px}.inv td,.inv th{padding:6px 4px}}
@media print{@page{margin:12mm}body>*:not(#ovInv){display:none!important}#ovInv{position:static!important;display:block!important;background:none!important}#ovInv .pn{width:100%!important;max-height:none!important;animation:none!important;padding:0!important;overflow:visible!important;background:none!important}.noprint{display:none!important}.inv{border-radius:0;padding:0}body{background:#fff!important;padding:0!important}}
</style>
</head>
<body>
<div id="splash"><div class="lg gold">VELON</div><div class="ln"></div><p id="spt"></p></div>
<div id="offl"><span data-i="offl"></span><button onclick="location.reload()" data-i="reload"></button></div>
<header><div class="lg gold">VELON</div><button class="ib" id="bTheme">🌓</button><button class="ib" id="bLang">EN</button><button class="ib" id="bAdm">⚙️</button><button class="ib" id="bCart">🛒<span class="bd" id="cnt">0</span></button></header>
<main>
 <nav id="nv"><button class="chip on" data-v="h" onclick="view('h')">🏠 <span data-i="navH"></span></button><button class="chip" data-v="s" onclick="view('s')">🛍 <span data-i="navS"></span></button><button class="chip" data-v="t" onclick="view('t')">📦 <span data-i="navT"></span></button></nav>
 <div id="vH">
 <div class="car" id="car"><div class="tr" id="tr"></div><button class="ar2" id="pv" style="inset-inline-start:8px">‹</button><button class="ar2" id="nx" style="inset-inline-end:8px">›</button><div class="dots" id="dots"></div></div>
 <div class="prs" id="prs"></div>
 <section class="hero"><h1 class="gold" data-i="hero"></h1><p data-i="sub"></p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn" onclick="view('s')" data-i="shop"></button><button class="btn o" onclick="view('t')" data-i="trackb"></button></div></section>
 <h2 class="t" id="off" data-i="offers"></h2><div class="grid" id="offG"></div>
 </div>
 <div id="vS" style="display:none">
 <h2 class="t" id="cat" data-i="catalog"></h2><input class="search" id="q" data-ph="search"><div class="chips" id="chips"></div><div class="grid" id="grid"></div>
 </div>
 <div id="vT" style="display:none"><div class="trc"><div style="font-size:44px">📦</div><h2 class="gold" data-i="trH"></h2><p data-i="trP"></p><div style="display:flex;gap:8px"><input class="in" id="tp" type="tel" inputmode="numeric" maxlength="10" placeholder="09XXXXXXXX" style="margin:0"><button class="btn" onclick="doTr()" data-i="track"></button></div></div><div id="trR"></div></div>
 <div>
 <h2 class="t" data-i="why"></h2><div class="why"><div><b>✨</b><span data-i="w1"></span></div><div><b>🚚</b><span data-i="w2"></span></div><div><b>🛡️</b><span data-i="w3"></span></div><div><b>💬</b><span data-i="w4"></span></div></div>
 <h2 class="t" data-i="help"></h2><div class="hlp"><button class="btn" id="bSup" data-i="support"></button><button class="btn" id="bWh" data-i="whol"></button><button class="btn o" id="bAddr" data-i="addrB" style="display:none"></button><button class="btn o" id="bInq" data-i="inquiry"></button></div>
</div>
</main>
<div class="fab"><button id="top" onclick="toTop()">↑</button></div>
<div id="bar"><button class="btn" id="bBar"><span id="bc"></span><span id="bt"></span></button></div>

<div class="ov" id="ovCart"><div class="pn"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h2 data-i="cart"></h2><button class="ib" onclick="shut('ovCart')">✕</button></div><div id="cartB"></div></div></div>
<div class="ov c" id="ovChk"><div class="pn md"><h2 data-i="details" style="margin-bottom:12px"></h2>
 <div class="opt"><label><input type="radio" name="ty" value="d" checked>🚚 <span data-i="delivery"></span></label><label><input type="radio" name="ty" value="p">🏬 <span data-i="pickup"></span></label></div>
 <input class="in" id="cn" data-ph="name"><input class="in" id="cp" type="tel" inputmode="numeric" maxlength="10" placeholder="09XXXXXXXX">
 <div id="dBox"><select class="in" id="cz"></select><textarea class="in" id="ca" rows="2" data-ph="addr"></textarea><label class="l" data-i="payhow"></label>
  <div class="opt"><label><input type="radio" name="py" value="c" checked>💵 <span data-i="cash"></span></label><label><input type="radio" name="py" value="s">📲 <span data-i="sham"></span></label></div><div id="shBox" style="display:none"></div></div>
 <div id="pBox" style="display:none"><div id="stA" class="nt" style="margin-bottom:8px"></div><label class="l" data-i="ptime"></label><input class="in" id="ct" type="datetime-local"></div>
 <div id="sumB" class="row" style="display:block"></div>
 <label style="display:flex;gap:8px;margin-bottom:10px"><input type="checkbox" id="wa" checked><span data-i="sendwa"></span></label>
 <div style="display:flex;gap:8px"><button class="btn" id="bPlace" style="flex:1" data-i="place"></button><button class="btn o" onclick="shut('ovChk')" data-i="cancel"></button></div></div></div>
<div class="ov c" id="ovOk"><div class="pn md" style="text-align:center"><div style="font-size:56px">✅</div><h2 data-i="done"></h2><p style="margin:10px 0;color:var(--mu)" data-i="ordno"></p><div class="tot" id="ono"></div><div id="okx" style="margin-top:12px"></div><button class="btn" style="margin-top:16px" onclick="shut('ovOk')" data-i="close"></button></div></div>
<input type="file" id="rcp" accept="image/*" style="position:fixed;left:-9999px;top:0;opacity:0;width:1px;height:1px">
<div class="ov c" id="ovAsk"><div class="pn md"><h2 id="askT" style="margin-bottom:6px"></h2><p id="askH" style="color:var(--mu);font-size:14px;margin-bottom:10px"></p><textarea class="in" id="askX" rows="4"></textarea><div style="display:flex;gap:8px"><button class="btn" id="askS" style="flex:1" data-i="sendwa2"></button><button class="btn o" onclick="shut('ovAsk')" data-i="cancel"></button></div></div></div>
